<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechSolutions | Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">
            <h1>TechSolutions</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="contact-form">
            <h2>Get In Touch</h2>
            <p>Send us a message and a corporate consultant will contact you within 24 business hours.</p>
            <br>
            <form action="#" method="POST" onsubmit="event.preventDefault(); alert('Message simulation sent successfully!');">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" rows="5" required placeholder="How can we help your business?"></textarea>
                </div>
                <button type="submit">Submit Inquiry</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 TechSolutions. All rights reserved.</p>
    </footer>

</body>
</html>
