<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Image Gallery & Slideshow</title>
    <style>
        /* Base Setup & Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f5f3;
            padding: 40px 20px;
            color: #9a3cd8;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        /* 1. Responsive Grid Layout */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            /* Smooth transition tracking for hover transformations */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        /* Hover Zoom & Shadow Effects */
        .gallery-item:hover {
            transform: scale(1.04);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
        }

        /* 2. Lightbox Slideshow Modal */
        .modal {
            display: none; /* Invisible by default */
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            user-select: none;
        }
        .modal-content-wrapper {
            position: relative;
            max-width: 85%;
            max-height: 80%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .modal-img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        /* Navigation Buttons */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(255, 255, 255, 0.15);
            color: white;
            border: none;
            font-size: 2rem;
            padding: 10px 18px;
            cursor: pointer;
            border-radius: 50%;
            transition: background-color 0.2s;
        }
        .nav-btn:hover {
            background-color: rgba(255, 255, 255, 0.4);
        }
        .prev-btn { left: -70px; }
        .next-btn { right: -70px; }

        .close-btn {
            position: absolute;
            top: -50px;
            right: 0;
            background: none;
            border: none;
            color: #fff;
            font-size: 2.5rem;
            cursor: pointer;
            opacity: 0.7;
        }
        .close-btn:hover { opacity: 1; }

        /* Auto-play UI controls indicator toggle badge */
        .autoplay-control {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #222;
            color: #fff;
            border: 1px solid #555;
            padding: 6px 14px;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 20px;
        }
        .autoplay-control.active {
            background-color: #27ae60;
            border-color: #27ae60;
        }

        /* Media adjustments for narrow windows */
        @media (max-width: 768px) {
            .prev-btn { left: 10px; }
            .next-btn { right: 10px; }
            .nav-btn { background-color: rgba(0,0,0,0.5); font-size: 1.5rem; padding: 8px 14px;}
            .close-btn { top: 10px; right: 20px; }
        }
    </style>
</head>
<body>

    <h1>Interactive Image Gallery</h1>

    <!-- Image Grid Container -->
    <div class="gallery-grid">
        <div class="gallery-item"><img src="image1.png" alt="Scenic view 1"></div>
        <div class="gallery-item"><img src="image2.png" alt="Scenic view 2"></div>
        <div class="gallery-item"><img src="image3.png" alt="Scenic view 3"></div>
        <div class="gallery-item"><img src="image4.png" alt="Scenic view 4"></div>
        <div class="gallery-item"><img src="image5.png" alt="Scenic view 5"></div>
        <div class="gallery-item"><img src="image6.png" alt="Scenic view 6"></div>
    </div>

    <!-- Slideshow Overlaid Modal Window -->
    <div class="modal" id="galleryModal">
        <div class="modal-content-wrapper">
            <button class="close-btn" id="closeModal">&times;</button>
            <button class="nav-btn prev-btn" id="prevBtn">&#10094;</button>
            <img src="" alt="Slideshow Preview" class="modal-img" id="modalImg">
            <button class="nav-btn next-btn" id="nextBtn">&#10095;</button>
            <button class="autoplay-control" id="autoplayBtn">Autoplay: OFF</button>
        </div>
    </div>

    <script>
        // DOM Element Caching
        const galleryItems = document.querySelectorAll('.gallery-item img');
        const modal = document.getElementById('galleryModal');
        const modalImg = document.getElementById('modalImg');
        const closeModal = document.getElementById('closeModal');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const autoplayBtn = document.getElementById('autoplayBtn');

        let currentIndex = 0;
        let autoplayInterval = null;
        let isAutoplayOn = false;
        const autoplayDelay = 3000; // Duration delay in milliseconds (3 seconds)

        // Opens overlay containing target specific image index view
        function openSlideshow(index) {
            currentIndex = index;
            updateModalImage();
            modal.style.display = 'flex';
            if (isAutoplayOn) startAutoplay();
        }

        // Refreshes image target attributes within rendering logic
        function updateModalImage() {
            modalImg.src = galleryItems[currentIndex].src;
            modalImg.alt = galleryItems[currentIndex].alt;
        }

        // Increments or decrements slide step tracker safely
        function changeSlide(direction) {
            if (direction === 'next') {
                currentIndex = (currentIndex + 1) % galleryItems.length;
            } else if (direction === 'prev') {
                currentIndex = (currentIndex - 1 + galleryItems.length) % galleryItems.length;
            }
            updateModalImage();
        }

        // Handles auto-cycling system timers safely
        function startAutoplay() {
            stopAutoplay(); // Clear existing timers before creating new ones
            autoplayInterval = setInterval(() => {
                changeSlide('next');
            }, autoplayDelay);
        }

        function stopAutoplay() {
            if (autoplayInterval) {
                clearInterval(autoplayInterval);
            }
        }

        // Event Handling Hooks
        galleryItems.forEach((img, index) => {
            img.addEventListener('click', () => openSlideshow(index));
        });

        nextBtn.addEventListener('click', () => {
            changeSlide('next');
            if (isAutoplayOn) startAutoplay(); // Reset interval countdown on user interaction
        });

        prevBtn.addEventListener('click', () => {
            changeSlide('prev');
            if (isAutoplayOn) startAutoplay(); // Reset interval countdown on user interaction
        });

        closeModal.addEventListener('click', () => {
            modal.style.display = 'none';
            stopAutoplay();
        });

        // Toggle Autoplay button functionality
        autoplayBtn.addEventListener('click', () => {
            isAutoplayOn = !isAutoplayOn;
            if (isAutoplayOn) {
                autoplayBtn.textContent = "Autoplay: ON";
                autoplayBtn.classList.add('active');
                startAutoplay();
            } else {
                autoplayBtn.textContent = "Autoplay: OFF";
                autoplayBtn.classList.remove('active');
                stopAutoplay();
            }
        });

        // Close modal when user clicks on background dark area
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
                stopAutoplay();
            }
        });

        // Keyboard Arrow & Escape support mapping
        document.addEventListener('keydown', (e) => {
            if (modal.style.display === 'flex') {
                if (e.key === 'ArrowRight') changeSlide('next');
                if (e.key === 'ArrowLeft') changeSlide('prev');
                if (e.key === 'Escape') {
                    modal.style.display = 'none';
                    stopAutoplay();
                }
            }
        });
    </script>
</body>
</html>
