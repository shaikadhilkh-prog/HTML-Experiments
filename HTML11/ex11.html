
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Information</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #2193b0, #6dd5ed);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        h1 {
            color: #2193b0;
            margin-bottom: 20px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            width: 70%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        button {
            padding: 12px 15px;
            background: #2193b0;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #176b85;
        }

        #message {
            color: red;
            margin: 15px 0;
        }

        .weather-result {
            display: none;
            margin-top: 20px;
        }

        .weather-icon {
            font-size: 65px;
            margin: 10px;
        }

        .temperature {
            font-size: 45px;
            font-weight: bold;
            color: #2193b0;
            margin: 10px;
        }

        .condition {
            font-size: 20px;
            color: #555;
            margin-bottom: 20px;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .detail-box {
            background: #eef8fb;
            padding: 15px;
            border-radius: 10px;
        }

        .detail-box h3 {
            color: #2193b0;
            margin-bottom: 8px;
        }

        .detail-box p {
            font-size: 17px;
            color: #333;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Weather App</h1>

        <div class="search-box">
            <input type="text" id="cityInput"
                   placeholder="Enter city name">
            <button onclick="getWeather()">Search</button>
        </div>

        <p id="message"></p>

        <div class="weather-result" id="weatherResult">

            <h2 id="cityName"></h2>

            <div class="weather-icon" id="weatherIcon">☀️</div>

            <div class="temperature" id="temperature"></div>

            <div class="condition" id="condition"></div>

            <div class="details">

                <div class="detail-box">
                    <h3>Humidity</h3>
                    <p id="humidity"></p>
                </div>

                <div class="detail-box">
                    <h3>Wind Speed</h3>
                    <p id="wind"></p>
                </div>

            </div>
        </div>

    </div>

    <script>

        async function getWeather() {

            const city = document.getElementById("cityInput").value.trim();

            const message = document.getElementById("message");
            const result = document.getElementById("weatherResult");

            message.textContent = "";
            result.style.display = "none";

            if (city === "") {
                message.textContent = "Please enter a city name!";
                return;
            }

            message.style.color = "blue";
            message.textContent = "Loading weather data...";

            try {

                // Step 1: Get city coordinates

                const geoURL =
                    `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`;

                const geoResponse = await fetch(geoURL);

                if (!geoResponse.ok) {
                    throw new Error("Unable to connect to server.");
                }

                const geoData = await geoResponse.json();

                if (!geoData.results || geoData.results.length === 0) {
                    throw new Error("City not found! Please enter a valid city.");
                }

                const location = geoData.results[0];

                const latitude = location.latitude;
                const longitude = location.longitude;

                // Step 2: Get weather information

                const weatherURL =
                    `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m&timezone=auto`;

                const weatherResponse = await fetch(weatherURL);

                if (!weatherResponse.ok) {
                    throw new Error("Unable to fetch weather data.");
                }

                const weatherData = await weatherResponse.json();

                const current = weatherData.current;

                // Step 3: Display weather information

                document.getElementById("cityName").textContent =
                    location.name + ", " + (location.country || "");

                document.getElementById("temperature").textContent =
                    current.temperature_2m + " °C";

                document.getElementById("humidity").textContent =
                    current.relative_humidity_2m + " %";

                document.getElementById("wind").textContent =
                    current.wind_speed_10m + " km/h";

                document.getElementById("condition").textContent =
                    getCondition(current.weather_code);

                document.getElementById("weatherIcon").textContent =
                    getIcon(current.weather_code, current.is_day);

                result.style.display = "block";

                message.textContent = "";

            }

            catch (error) {

                message.style.color = "red";
                message.textContent = error.message;

            }
        }

        // Convert weather code into condition

        function getCondition(code) {

            if (code === 0) return "Clear Sky";
            if (code === 1) return "Mainly Clear";
            if (code === 2) return "Partly Cloudy";
            if (code === 3) return "Overcast";
            if ([45, 48].includes(code)) return "Foggy";
            if ([51, 53, 55, 56, 57].includes(code)) return "Drizzle";
            if ([61, 63, 65, 66, 67].includes(code)) return "Rainy";
            if ([71, 73, 75, 77].includes(code)) return "Snowy";
            if ([80, 81, 82].includes(code)) return "Rain Showers";
            if ([85, 86].includes(code)) return "Snow Showers";
            if ([95, 96, 99].includes(code)) return "Thunderstorm";

            return "Unknown Weather";
        }

        // Weather icons

        function getIcon(code, isDay) {

            if (code === 0) return isDay ? "☀️" : "🌙";
            if ([1, 2].includes(code)) return "⛅";
            if (code === 3) return "☁️";
            if ([45, 48].includes(code)) return "🌫️";
            if ([51, 53, 55, 56, 57].includes(code)) return "🌦️";
            if ([61, 63, 65, 66, 67].includes(code)) return "🌧️";
            if ([71, 73, 75, 77, 85, 86].includes(code)) return "❄️";
            if ([80, 81, 82].includes(code)) return "🌧️";
            if ([95, 96, 99].includes(code)) return "⛈️";

            return "🌍";
        }

        // Search when Enter key is pressed

        document.getElementById("cityInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                getWeather();
            }
        });

    </script>

</body>
</html>
