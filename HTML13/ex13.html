
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Search Application</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            padding: 40px 15px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        #searchInput {
            width: 100%;
            padding: 14px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        #searchInput:focus {
            border-color: #2563eb;
        }

        #resultCount {
            margin: 20px 0 10px;
            color: #64748b;
        }

        .result {
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #f8fafc;
        }

        .result h3 {
            color: #2563eb;
            margin-bottom: 6px;
        }

        .result p {
            color: #475569;
            line-height: 1.5;
        }

        .message {
            text-align: center;
            color: #64748b;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Live Search</h1>
        <p class="subtitle">
            Search users instantly without reloading the page
        </p>

        <input
            type="text"
            id="searchInput"
            placeholder="Search by name, email or username..."
        >

        <p id="resultCount">Loading users...</p>

        <div id="results">
            <p class="message">Loading data...</p>
        </div>

    </div>

    <script>

        const searchInput = document.getElementById("searchInput");
        const results = document.getElementById("results");
        const resultCount = document.getElementById("resultCount");

        let users = [];

        // Fetch data from REST API
        async function loadUsers() {

            try {

                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/users"
                );

                if (!response.ok) {
                    throw new Error("Failed to fetch data");
                }

                users = await response.json();

                displayUsers(users);

            } catch (error) {

                results.innerHTML =
                    '<p class="message">Unable to load data. Please try again.</p>';

                resultCount.textContent = "Error loading users";

            }

        }

        // Display users
        function displayUsers(data) {

            results.innerHTML = "";

            resultCount.textContent =
                data.length + " user(s) found";

            if (data.length === 0) {

                results.innerHTML =
                    '<p class="message">No matching results found!</p>';

                return;

            }

            data.forEach(user => {

                const div = document.createElement("div");
                div.className = "result";

                const name = document.createElement("h3");
                name.textContent = user.name;

                const email = document.createElement("p");
                email.textContent = "Email: " + user.email;

                const username = document.createElement("p");
                username.textContent = "Username: " + user.username;

                div.appendChild(name);
                div.appendChild(email);
                div.appendChild(username);

                results.appendChild(div);

            });

        }

        // Live search functionality
        searchInput.addEventListener("input", function () {

            const searchText = this.value.toLowerCase().trim();

            const filteredUsers = users.filter(user => {

                return (
                    user.name.toLowerCase().includes(searchText) ||
                    user.email.toLowerCase().includes(searchText) ||
                    user.username.toLowerCase().includes(searchText)
                );

            });

            displayUsers(filteredUsers);

        });

        // Load users when page opens
        loadUsers();

    </script>

</body>
</html>
